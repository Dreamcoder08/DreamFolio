# DreamFolio — Spec-Driven Development configuration
# Generated by sdd-init. Keep `context` short; phase `rules` drive downstream agents.
schema: spec-driven
project: dreamfolio
persistence:
  artifact_store: openspec
  engram_available: true
  registry: .atl/skill-registry.md

context: |
  Project: DreamFolio — single-page Astro portfolio, statically generated.
  Stack: Astro 7.x (output: 'static', zero client-side JS framework), TypeScript strict, Tailwind CSS 4.x CSS-first (@theme in src/styles/global.css; no tailwind.config.mjs).
  Runtime: pnpm 10.33.0 (corepack), Node >= 22.
  Deploy: GitHub Actions -> GitHub Pages (base /DreamFolio) and Vercel, selected at build time in astro.config.mjs.
  Conventions: Conventional Commits; specs/code/comments in English; README.md in Spanish; CI is the gate (no husky/lint-staged/pre-commit).
  Project skills: astro-islands-patterns, portfolio-content-workflow (see .atl/skill-registry.md).

# Strict TDD is enabled: one workspace-level command (`pnpm run test:unit`) covers the
# single in-scope project for the RED-GREEN-REFACTOR inner loop; e2e and build gates add
# outer verification. See `testing:` for the complete, truthful command set.
strict_tdd: true

projects:
  - path: "."
    stack: "Astro 7 + TypeScript strict + Tailwind CSS 4 + Playwright"
    unit_test_command: "pnpm run test:unit"
    e2e_test_command: "pnpm run test:e2e"
    build_typecheck_command: "pnpm run verify"

testing:
  strict_tdd: true
  runner: "node --test (built-in)"
  unit:
    command: "pnpm run test:unit"
    framework: "node:test with --experimental-strip-types"
    files: "tests/unit/*.test.ts"
    count: 15
    status: green
  e2e:
    command: "pnpm run test:e2e"
    framework: "Playwright (chromium)"
    count: 20
    status: green
  build_typecheck:
    command: "pnpm run verify"
  format:
    command: "pnpm run format:check"
    notes: "prettier; openspec/ and docs/ are in .prettierignore"
  secret_scan:
    command: "pnpm run secret:scan"
    notes: "gitleaks; enforced in CI"
  coverage:
    available: false
    command: "—"

rules:
  proposal:
    - State scope, risks, and a rollback plan for risky changes
    - Reuse and reference existing artifacts under openspec/changes/ when continuing work
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document decisions with rationale and trade-offs
    - Preserve static output; add client-side JS only when explicitly scoped
  tasks:
    - Group by phase with hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing Astro/Tailwind/TypeScript patterns
      - Never reintroduce tailwind.config.mjs (CSS-first @theme only)
      - Keep color/theme work accessible across light and dark schemes
    tdd: true
    test_command: "pnpm run test:unit"
  verify:
    test_command: "pnpm run test:unit"
    e2e_command: "pnpm run test:e2e"
    build_command: "pnpm run verify"
    format_command: "pnpm run format:check"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Never delete or modify archived changes
