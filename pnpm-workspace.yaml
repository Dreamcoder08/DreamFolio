# The dependency build-script gate lives here, not in package.json. pnpm 11 moved
# settings out of package.json's `pnpm` field into this file, and `allowBuilds` is
# the consolidated replacement for `onlyBuiltDependencies` and its siblings. The
# empty `pnpm.onlyBuiltDependencies: []` that used to sit in package.json was the
# pre-move spelling of "no dependency may run a build script"; it was removed with
# everything else in that field, so the gate moved rather than being dropped.
allowBuilds:
  esbuild: false
  sharp: false

# pnpm 11 stopped reading these from `.npmrc`: it now reads only auth and
# registry settings there, and every other setting moved to this file. Left
# behind in `.npmrc` they would have stopped applying without saying so.
saveExact: true
engineStrict: true
strictPeerDependencies: true
