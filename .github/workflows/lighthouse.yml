name: Lighthouse

# Lighthouse on a clean CI machine, against the production build. Local runs
# on the development laptop are not trustworthy: its thermal throttling
# inflated first paint from ~0.4 s to ~3.4 s in a controlled comparison. This
# workflow is the reference measurement. Median of three runs on the first
# clean-runner build: performance 96, FCP 1.4 s, LCP 2.7 s, TBT 0 ms, CLS
# 0.002, accessibility / best-practices / SEO 100 — the budgets sit under that.
# Category scores and CLS/TBT fail the job. LCP only warns: it is the noisiest
# metric on shared runners (network and CPU contention), and the performance
# score already weights it, so a real LCP regression still trips the 0.9 floor.
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root base path, like the e2e job, so the static server serves it as-is.
      - name: Build site
        run: pnpm run build
        env:
          SITE_BASE: /
          NODE_ENV: production

      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      # lhci prints only failures; this shows the numbers on every run.
      - name: Summarize scores
        if: always()
        run: node scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
