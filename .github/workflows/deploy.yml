name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege at the top, and each job raises its own scope below. A
# workflow-level grant would hand every step a token broader than it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned tool versions. Bump deliberately and replace the checksum with it.
  # The digest below was verified against the release's published checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build:
    runs-on: ubuntu-latest
    # upload-pages-artifact writes the Pages artifact, which needs pages: write.
    permissions:
      contents: read
      pages: write

    steps:
      # Every action is pinned to a full commit SHA instead of a mutable tag:
      # if a tag is moved or an upstream account is compromised, the pinned SHA
      # keeps this workflow running the reviewed code. The trailing version
      # comment is what Dependabot reads to propose upgrades.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the secret scan covers every commit, not just HEAD.
          fetch-depth: 0
          # No step needs the token written into the git config.
          persist-credentials: false

      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          # An accepted historical finding must not become an open-ended
          # waiver. .gitleaksignore carries its own expiry, and this fails
          # closed without one, so the scan cannot stay green over a live
          # credential forever. See the Security section of README.md.
          expires=$(sed -n 's/^# expires: *//p' .gitleaksignore | head -1)
          if [ -z "$expires" ]; then
            echo "::error::.gitleaksignore has no '# expires:' date; waivers must not be open-ended."
            exit 1
          fi
          if [[ "$(date -u +%F)" > "$expires" ]]; then
            echo "::error::The .gitleaksignore waiver expired on $expires. Rotate the exposed credential in Supabase, delete the waiver, then re-run."
            exit 1
          fi
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build site
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          # v4 stopped including hidden files, and this input defaults to
          # false. `dist/.well-known/` holds the RFC 9116 security.txt that
          # README.md points readers at, so the default would silently drop a
          # deployed file. Verified against the live URL after deploy, not by
          # reading the action's source.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages creates the deployment and proves through OIDC that it came
    # from this workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
