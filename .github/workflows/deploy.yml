name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege at the top, and each job raises its own scope below. A
# workflow-level grant would hand every step a token broader than it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Pinned tool versions. Bump deliberately and replace the checksum with it.
  # The digest below was verified against the release's published checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  build:
    runs-on: ubuntu-latest
    # upload-pages-artifact writes the Pages artifact, which needs pages: write.
    permissions:
      contents: read
      pages: write

    steps:
      # Every action is pinned to a full commit SHA instead of a mutable tag:
      # if a tag is moved or an upstream account is compromised, the pinned SHA
      # keeps this workflow running the reviewed code. The trailing version
      # comment is what Dependabot reads to propose upgrades.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the secret scan covers every commit, not just HEAD.
          fetch-depth: 0
          # No step needs the token written into the git config.
          persist-credentials: false

      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          # An accepted historical finding must not become an open-ended
          # waiver. .gitleaksignore carries its own expiry, and this fails
          # closed without one, so the scan cannot stay green over a live
          # credential forever. See the Security section of README.md.
          expires=$(sed -n 's/^# expires: *//p' .gitleaksignore | head -1)
          if [ -z "$expires" ]; then
            echo "::error::.gitleaksignore has no '# expires:' date; waivers must not be open-ended."
            exit 1
          fi
          if [[ "$(date -u +%F)" > "$expires" ]]; then
            echo "::error::The .gitleaksignore waiver expired on $expires. Rotate the exposed credential in Supabase, delete the waiver, then re-run."
            exit 1
          fi
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Build site
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # deploy-pages creates the deployment and proves through OIDC that it came
    # from this workflow.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
