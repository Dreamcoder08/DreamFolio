name: CI

# Runs the same gate as the deploy workflow, but on pull requests, so a
# reviewer sees failures before anything reaches main. Deploy keeps its own
# copy of these steps on purpose: refactoring a working deploy pipeline and
# adding new behaviour in the same change is how deploys break.
on:
  pull_request:
  workflow_dispatch:

permissions:
  # Nothing here writes to the repository, so this is the whole scope.
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions. Bump deliberately and replace the checksum with it.
  # The digest below was verified against the release's published checksums.txt.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      # Actions are pinned to full commit SHAs instead of mutable tags. The
      # trailing version comment is what Dependabot reads to propose upgrades.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the secret scan covers every commit, not just HEAD.
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          # An accepted historical finding must not become an open-ended
          # waiver. .gitleaksignore carries its own expiry, and this fails
          # closed without one, so the scan cannot stay green over a live
          # credential forever. See the Security section of README.md.
          expires=$(sed -n 's/^# expires: *//p' .gitleaksignore | head -1)
          if [ -z "$expires" ]; then
            echo "::error::.gitleaksignore has no '# expires:' date; waivers must not be open-ended."
            exit 1
          fi
          if [[ "$(date -u +%F)" > "$expires" ]]; then
            echo "::error::The .gitleaksignore waiver expired on $expires. Rotate the exposed credential in Supabase, delete the waiver, then re-run."
            exit 1
          fi
          ./gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.4.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run check

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      # E2E builds with SITE_BASE=/. This validates the production base path
      # (/DreamFolio on GitHub Pages), which is what actually gets deployed.
      - name: Build site (production base path)
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
