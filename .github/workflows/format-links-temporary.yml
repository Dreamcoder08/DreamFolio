name: Links format preview (temporary)
on:
  pull_request:
    paths:
      - 'src/pages/links.astro'
      - 'src/data/links.ts'
      - 'src/scripts/links.ts'
      - 'src/styles/links*.css'
      - 'tests/links.spec.ts'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Render formatted sources
        run: |
          pnpm exec prettier --write \
            src/pages/links.astro src/data/links.ts src/scripts/links.ts \
            src/styles/links.css src/styles/links-cards.css tests/links.spec.ts
          for file in \
            src/pages/links.astro src/data/links.ts src/scripts/links.ts \
            src/styles/links.css src/styles/links-cards.css tests/links.spec.ts; do
            echo "FORMAT_FILE_START=$file"
            base64 -w120 "$file"
            echo
            echo "FORMAT_FILE_END=$file"
          done
